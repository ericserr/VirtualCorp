# ============================================================
# VirtualCorp - Inventari d'equips de la delegació 25 (10.25.0.0/16)
# ============================================================
# Una línia per màquina basada en els templates Debian (clons enllaçats).
# pve01 NO hi és: s'instal·la des de la ISO de Proxmox VE (deploy_pve.sh).
#
# Camps (separats per espais):
#   nom        nom de la VM i hostname (via DmiSystemSerial)
#   template   server | desktop
#   xarxa      xarxa interna de VirtualBox (NIC1, única interfície)
#   ram        memòria en MB
#   cpus       nombre de vCPU
#   grup       grup VirtualBox: servers | printers | desktops
#   ip         adreça prevista (informativa: totes fan DHCP); "-" = dinàmica
#
# Noms de xarxa: s'utilitzen EXACTAMENT els dels routers ja desplegats
# (p. ex. "pl3-direccio"), perquè un altre nom seria un switch virtual
# diferent i el clon quedaria aïllat del seu router.
# ============================================================
# nom          template  xarxa          ram   cpus  grup      ip
