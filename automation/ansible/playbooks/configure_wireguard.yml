---
# VPN WireGuard de VirtualCorp: 1) claus del client, 2) servidor a mikrotik0,
# 3) fitxer del client. Requereix mikrotik0 encès (playbooks/start_routers.yml).

- name: Generar o llegir les claus del client WireGuard
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Claus del client
      ansible.builtin.include_role:
        name: wireguard_client
        tasks_from: keys.yml

- name: Configurar el servidor WireGuard a mikrotik0
  hosts: mikrotik0
  gather_facts: false
  vars:
    wg_client_public_key: "{{ hostvars['localhost']['wg_client_public_key'] }}"
    vboxmanage_bin: "{{ hostvars['localhost']['vboxmanage_bin'] }}"
  roles:
    - wireguard_server

- name: Escriure el fitxer de configuració del client
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Fitxer del client
      ansible.builtin.include_role:
        name: wireguard_client
        tasks_from: config.yml
      vars:
        wg_server_public_key: "{{ hostvars['mikrotik0']['wg_server_public_key'] }}"
