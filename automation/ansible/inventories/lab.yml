---
all:
  children:
    vbox:
      hosts:
        localhost:
          ansible_connection: local
          vboxmanage_bin: VBoxManage
          mikrotik_routers:
            - mikrotik0
            - mikrotik1
            - mikrotik2
            - mikrotik3
    routeros:
      hosts:
        mikrotik0:
          # Reenviament TCP de VirtualBox 127.0.0.1:2200 -> 22 (NIC1, NAT)
          ansible_host: 127.0.0.1
          ansible_port: 2200
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: community.routeros.routeros
        # +cet1024w: sense colors ni detecció de terminal, amplada 1024
        ansible_user: sysadmin+cet1024w
        # Clau privada local (mai al repositori); autenticació sense contrasenya
        ansible_ssh_private_key_file: ~/.ssh/vcorp_sysadmin
